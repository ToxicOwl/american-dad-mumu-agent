name: Release Windows package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable version tag, for example v1.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile Arena Control
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          & $compiler /nologo /target:winexe /out:dist\AmericanDadArena.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Web.Extensions.dll scripts\ArenaControl.cs
          if ($LASTEXITCODE -ne 0) { throw "C# compiler failed with exit code $LASTEXITCODE" }

      - name: Build release archive
        shell: pwsh
        run: |
          $stage = 'dist\AmericanDadArena'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path 'dist\AmericanDadArena.exe' -Destination "$stage\AmericanDadArena.exe"
          Copy-Item -Path 'ad_agent', 'calibration', 'scripts', 'tests' -Destination $stage -Recurse
          Copy-Item -Path '.gitignore', 'CHANGELOG.md', 'config.example.json', 'LICENSE', 'pyproject.toml', 'README.md', 'README-Arena-Control.md', 'release.json' -Destination $stage
          Remove-Item -Path "$stage\scripts\*.pre-*.ps1", "$stage\scripts\*-hotfix.ps1" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath 'dist\AmericanDadArena-Windows.zip' -Force

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: dist/AmericanDadArena-Windows.zip
